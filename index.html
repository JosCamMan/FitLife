<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0f1210">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Programa de gimnasio · Camacho</title>
<style>
:root{
  --bg:#0f1210; --card:#181c19; --card2:#1f2420; --line:#2b322d; --txt:#e9efe9; --mut:#97a39a;
  --acc:#9be15d; --acc2:#5fd3a0; --warn:#f2b84b; --bad:#ef6a5a; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}
header{position:sticky;top:0;z-index:15;background:var(--bg);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 -14px 10px;padding:calc(env(safe-area-inset-top) + 22px) 14px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0;letter-spacing:-.01em;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--acc);color:#10200a;border-color:var(--acc);font-weight:650}
.chip.ph{color:var(--acc);border-color:#3c5a2a}
.spacer{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,18,16,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:150px;background:none;border:0;padding:8px 2px;border-radius:10px;color:var(--mut);font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:18px;line-height:1}
nav.tabs button.on{color:var(--acc);background:#1b2318}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sessions{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sessions button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;min-width:118px}
.sessions button b{display:block;font-size:13px}
.sessions button span{font-size:11.5px;color:var(--mut)}
.sessions button.on{border-color:var(--acc);background:#1a2416}
.sessions button.next::after{content:"siguiente";display:block;font-size:10.5px;color:var(--acc);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.blockh{display:flex;align-items:baseline;gap:8px;margin:20px 2px 6px}
.blockh h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.blockh small{color:var(--mut)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:8px 0;overflow:hidden}
.ex.done{border-color:#3c5a2a}
.ex .top{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;cursor:pointer}
.ex .ss{flex:0 0 auto;font-size:11px;font-weight:700;color:#10200a;background:var(--acc2);border-radius:6px;padding:2px 6px;margin-top:2px}
.ex .nm{font-weight:650}
.ex .rx{font-size:13px;color:var(--mut);margin-top:2px}
.ex .rx b{color:var(--txt);font-weight:600}
.ex .last{font-size:12px;color:var(--acc2);margin-top:3px}
.ck{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;font-size:15px;color:transparent}
.ck.on{background:var(--acc);border-color:var(--acc);color:#10200a}
.det{padding:0 12px 12px;display:none}
.ex.open .det{display:block}
.det ol,.det ul{margin:6px 0 8px 18px;padding:0}
.det li{margin:3px 0}
.det .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-top:8px}
.alt{background:#2a2414;border:1px solid #4d4020;color:#f3dca2;border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.note{background:#17231c;border:1px solid #284636;color:#bfe8d1;border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13.5px}
.btn.pri{background:var(--acc);color:#10200a;border-color:var(--acc);font-weight:700}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:#5a2a25}
.sets{padding:0 12px 12px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:8px;align-items:center}
.set label{font-size:12px;color:var(--mut)}
.set input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;text-align:center}
.set.ok input{border-color:#3c5a2a}
.cardio{display:flex;gap:8px;align-items:center;padding:0 12px 12px}
.cardio input{width:80px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;text-align:center}
.finish{margin-top:20px}
.finish label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=range]{width:100%;accent-color:var(--acc)}
textarea{width:100%;min-height:70px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px}
.prog{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:30;background:#1c2a17;border:1px solid var(--acc);border-radius:999px;padding:8px 10px 8px 16px;display:none;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.timer.show{display:flex}
.timer b{font-variant-numeric:tabular-nums;font-size:20px;color:var(--acc);min-width:58px}
.timer.end b{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.small{font-size:12.5px}
h2{font-size:17px;margin:18px 2px 8px}
.pain{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.log{cursor:pointer}
.log .sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log .body{display:none;margin-top:8px}
.log.open .body{display:block}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sel{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%}
.critem{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.status{font-size:11.5px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
svg text{fill:var(--mut);font-size:10px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:#10200a;font-weight:700;padding:8px 14px;border-radius:10px;z-index:50;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">🏋️ Hoy</h1>
    <span class="chip ph" id="phChip"></span>
    <span class="chip" id="wkChip"></span>
    <span class="spacer"></span>
    <span class="status muted" id="status">cargando…</span>
  </header>
  <main id="view"></main>
</div>
<div class="timer" id="timer"><span class="muted small">Descanso</span><b id="tLeft">0:00</b><button class="btn sm" id="tPlus">+30 s</button><button class="btn sm" id="tStop">✕</button></div>
<div class="toast" id="toast"></div>
<nav class="tabs" id="tabs">
  <button data-t="hoy" class="on"><span class="i">🏋️</span>Hoy</button>
  <button data-t="prog"><span class="i">🗓️</span>Programa</button>
  <button data-t="food"><span class="i">🥗</span>Comida</button>
  <button data-t="hist"><span class="i">📈</span>Historial</button>
  <button data-t="prs"><span class="i">🏆</span>Marcas</button>
  <button data-t="guia"><span class="i">📘</span>Guía</button>
  <button data-t="coach" class="coachtab"><span class="i">🤖</span>Coach</button>
</nav>
<script>
const STANDALONE = true;
// ====== DATOS DEL PROGRAMA ======
const START_DATE = '2026-11-21';

// Base de cálculo (1RM estimado) a partir de tus marcas de AimHarder
const BASE_PRS = {
  bench:      { name: 'Press banca', rm: 95,  src: '75 kg × 8 (23/12/2025) → 1RM estimado' },
  backsquat:  { name: 'Sentadilla trasera', rm: 142.5, src: '142,5 kg × 1 (17/08/2026)' },
  frontsquat: { name: 'Sentadilla frontal', rm: 112, src: '105 kg × 2 (25/09/2024) → estimado' },
  deadlift:   { name: 'Peso muerto', rm: 180, src: '180 kg × 1 (24/09/2024)' },
  ohp:        { name: 'Press militar', rm: 70, src: 'Shoulder press 70 kg × 1 (07/11/2025)' },
  pushpress:  { name: 'Push press', rm: 80, src: '75 kg × 2 (06/07/2026) → estimado' },
  powerclean: { name: 'Power clean', rm: 105, src: '105 kg × 1 (09/04/2025)' },
};

const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);

// ====== BIBLIOTECA DE EJERCICIOS ======
// how: pasos · cues: claves · avoid: errores · alt: alternativa si molesta · video: búsqueda
const EX = {
  // ---------- MOVILIDAD ----------
  shoulder_cars: { name: 'CARs de hombro', type: 'mob',
    how: ['De pie, aprieta el puño y tensa todo el cuerpo (glúteo y abdomen) para que solo se mueva el hombro.',
          'Dibuja el círculo más grande posible con el brazo estirado: delante, arriba, detrás y abajo.',
          'Lento: unos 10–15 segundos por vuelta. Luego en sentido contrario.'],
    cues: ['El tronco no se mueve ni se arquea.', 'Busca el borde del rango y empuja con tensión, sin rebotes.'],
    video: 'shoulder CARs controlled articular rotations tutorial' },
  tspine_book: { name: 'Libro abierto torácico', type: 'mob',
    how: ['Túmbate de lado con las rodillas a 90° y una mancuerna ligera o sin peso en la mano de arriba.',
          'Abre el brazo de arriba hacia el otro lado siguiendo la mano con la mirada.',
          'Mantén 2 s al final y espira. Vuelve controlando.'],
    cues: ['Las rodillas no se separan.', 'Gira la parte alta de la espalda, no la zona lumbar.'],
    video: 'open book thoracic rotation exercise' },
  hip_9090: { name: '90/90 de cadera con elevaciones', type: 'mob',
    how: ['Siéntate en el suelo con las dos piernas dobladas a 90°: una delante y otra al lado.',
          'Gira las rodillas al otro lado sin usar las manos, si puedes.',
          'En cada lado, inclínate un poco sobre la pierna de delante y levanta 2 cm el pie de atrás durante 3 s. Esto es un "lift-off".'],
    cues: ['Espalda alta y larga.', 'Si notas pinchazo en el glúteo, reduce el rango o apoya las manos.'],
    video: '90 90 hip switch lift offs mobility' },
  wall_slides: { name: 'Deslizamientos en pared', type: 'mob',
    how: ['Espalda y antebrazos contra la pared, con los brazos en forma de "W".',
          'Desliza los brazos hacia arriba hasta formar una "Y" sin que la zona lumbar se despegue.',
          'Baja tirando de los codos hacia los bolsillos.'],
    cues: ['Costillas abajo.', 'Mejor menos recorrido y bien hecho.'],
    video: 'wall slides shoulder mobility' },
  sciatic_slider: { name: 'Deslizamiento neural del ciático (slider)', type: 'mob',
    how: ['Siéntate en el borde de un banco con la espalda recta.',
          'Estira la rodilla y a la vez lleva la cabeza hacia atrás, mirando al techo.',
          'Dobla la rodilla y a la vez baja la barbilla. Hazlo de forma fluida.'],
    cues: ['Es un deslizamiento, NO un estiramiento: no debe tensar ni doler.',
           'Si reproduce el dolor que baja por la pierna, haz menos recorrido o sáltatelo.'],
    video: 'sciatic nerve slider seated exercise' },
  hip_cars: { name: 'CARs de cadera a cuatro patas', type: 'mob',
    how: ['A cuatro patas, con el abdomen apretado.',
          'Lleva una rodilla hacia el pecho, ábrela hacia fuera, gírala hacia atrás y vuelve. Dibuja el círculo más grande que puedas.',
          '3 vueltas por sentido y lado, muy lentas.'],
    cues: ['La pelvis y la espalda no se mueven.', 'Si duele al llevar la rodilla al pecho, ese tramo hazlo más corto.'],
    video: 'hip CARs quadruped tutorial' },
  ankle_ktw: { name: 'Rodilla a la pared con carga (tobillo)', type: 'mob',
    how: ['Pie a un palmo de la pared, o sobre el cajón con una mancuerna encima del muslo.',
          'Lleva la rodilla hacia delante, por encima de los dedos, sin levantar el talón.',
          'Mantén 2 s al final y vuelve.'],
    cues: ['El talón pegado al suelo.', 'La rodilla va por encima del 2.º–3.er dedo.'],
    video: 'knee to wall ankle mobility weighted' },
  couch_active: { name: 'Couch stretch activo', type: 'mob',
    how: ['Una rodilla en el suelo, apoyada en la pared o en el banco, con el empeine apoyado detrás.',
          'Aprieta el glúteo de la pierna de atrás y lleva la pelvis hacia delante.',
          'Mantén 30 s. Luego 3 contracciones de 5 s empujando el empeine contra el apoyo.'],
    cues: ['Costillas abajo, sin arquear la espalda.', 'Ponte una esterilla debajo de la rodilla.'],
    video: 'couch stretch hip flexor PAILs RAILs' },
  tib_raises: { name: 'Elevaciones de tibial', type: 'mob',
    how: ['Espalda contra la pared y los talones a un pie de distancia.',
          'Sube las puntas de los pies todo lo que puedas y baja lento.'],
    cues: ['Rango completo.', 'Si te resulta fácil, aléjate más de la pared.'],
    video: 'tibialis raises wall' },
  copenhagen: { name: 'Plancha Copenhague corta', type: 'mob',
    how: ['Plancha lateral con la rodilla de arriba apoyada en el banco y la de abajo libre.',
          'Sube la cadera y aguanta. Es la versión corta: el apoyo está en la rodilla.'],
    cues: ['El cuerpo en línea recta.', 'Trabaja el aductor y estabiliza la pelvis.'],
    video: 'short lever copenhagen plank' },
  side_lying_abd: { name: 'Abducción de cadera tumbado (glúteo medio)', type: 'mob',
    how: ['Túmbate de lado con la pierna de abajo doblada y la de arriba recta, un poco por detrás del cuerpo.',
          'Sube la pierna con el talón por delante y la punta del pie ligeramente hacia el suelo.',
          'Aguanta 2 s arriba y baja en 3 s.'],
    cues: ['La pelvis no rueda hacia atrás.', 'Debes notarlo en la parte alta y lateral del glúteo.'],
    video: 'side lying hip abduction gluteus medius' },
  cossack: { name: 'Sentadilla cosaca', type: 'mob',
    how: ['Piernas muy abiertas. Baja hacia un lado doblando una rodilla mientras la otra pierna queda estirada con la punta del pie hacia arriba.',
          'Ayúdate con una mancuerna delante como contrapeso.'],
    cues: ['El talón de la pierna doblada no se levanta.', 'Solo baja hasta donde controles.'],
    video: 'cossack squat tutorial' },
  goblet_hold: { name: 'Sentadilla goblet profunda mantenida', type: 'mob',
    how: ['Coge una mancuerna de 12–16 kg pegada al pecho y baja hasta el fondo de la sentadilla.',
          'Mantén la posición. Usa los codos para abrir las rodillas y balancéate suavemente.'],
    cues: ['Pecho alto.', 'Si molesta el glúteo, sube un poco.'],
    video: 'goblet squat hold mobility pry' },
  lat_hang: { name: 'Colgarse de la barra (pasivo + activo)', type: 'mob',
    how: ['Cuélgate relajado 20 s.',
          'Después haz 5 elevaciones escapulares: baja los hombros sin doblar los codos.'],
    cues: ['Si tira del glúteo, apoya las puntas de los pies en el cajón.'],
    video: 'dead hang scapular pull ups' },
  thoracic_bench: { name: 'Extensión torácica en banco', type: 'mob',
    how: ['De rodillas frente al banco, con los codos apoyados encima y una barra o palo en las manos.',
          'Lleva el pecho hacia el suelo y las manos detrás de la cabeza. Espira y mantén 3 s.'],
    cues: ['Abdomen activo para que no se hunda la zona lumbar.'],
    video: 'bench thoracic extension stretch' },
  glute_bridge: { name: 'Puente de glúteo con pausa', type: 'mob',
    how: ['Boca arriba, con las rodillas dobladas y los pies apoyados.',
          'Sube la cadera apretando el glúteo, aguanta 3 s y baja lento.'],
    cues: ['Empuja con los talones.', 'Costillas abajo: no arquees la espalda al subir.'],
    video: 'glute bridge pause' },
  bird_dog: { name: 'Bird dog', type: 'mob',
    how: ['A cuatro patas. Estira a la vez el brazo y la pierna contrarios.',
          'Aguanta 3 s sin que se mueva la pelvis y vuelve.'],
    cues: ['Imagina un vaso de agua en la zona lumbar.'],
    video: 'bird dog exercise proper form' },

  // ---------- FUERZA / HIPERTROFIA ----------
  bench: { name: 'Press de banca', type: 'str', pr: 'bench',
    how: ['Túmbate con los ojos bajo la barra. Junta las escápulas y apoya bien los pies.',
          'Agarre un poco más ancho que los hombros. Saca la barra con los brazos estirados.',
          'Baja controlando, en 3 s, hasta la parte baja del pecho. Pausa de 1 s tocando el pecho, sin rebotar, y empuja fuerte.'],
    cues: ['Escápulas juntas y abajo durante toda la serie.', 'Codos a unos 45° del cuerpo, no abiertos a 90°.', 'Los glúteos no se despegan del banco.'],
    avoid: ['Rebotar la barra en el pecho.', 'Levantar la cadera.'],
    video: 'bench press technique tutorial' },
  wpullup: { name: 'Dominadas lastradas', type: 'str',
    how: ['Agarre prono algo más ancho que los hombros. Pon el lastre: una mancuerna entre los pies o un cinturón si hay.',
          'Empieza bajando los hombros y sube hasta que la barbilla pase la barra.',
          'Baja controlando en 2–3 s hasta estirar los brazos.'],
    cues: ['Sin kipping: son estrictas.', 'Piernas quietas y un poco por delante del cuerpo.'],
    alt: 'Si la mancuerna entre los pies tira del glúteo, haz dominadas sin lastre con 3 s de bajada.',
    video: 'weighted pull up technique' },
  ohp: { name: 'Press militar de pie', type: 'str', pr: 'ohp',
    how: ['Barra apoyada en los hombros, codos un poco por delante de la barra y glúteo apretado.',
          'Empuja en línea recta. Cuando la barra pase la frente, mete la cabeza "dentro de la ventana".',
          'Baja controlando hasta la clavícula.'],
    cues: ['Sin impulso de piernas: eso sería push press.', 'Costillas abajo, sin arquear la espalda.'],
    video: 'overhead press technique standing' },
  cs_row: { name: 'Remo con mancuernas con pecho apoyado', type: 'str',
    how: ['Banco inclinado a 30–45°. Túmbate boca abajo con una mancuerna en cada mano.',
          'Lleva los codos hacia atrás y hacia las caderas. Aprieta 2 s arriba.',
          'Baja hasta estirar del todo los brazos.'],
    cues: ['El pecho no se despega del banco: así la espalda baja descansa.', 'Pausa de 2 s arriba juntando las escápulas.'],
    video: 'chest supported dumbbell row' },
  facepull: { name: 'Face pull con cuerda', type: 'str',
    how: ['Polea alta con la cuerda. Agarre neutro, con los pulgares hacia ti.',
          'Tira hacia la cara separando las manos, con los codos altos, y gira para que los puños acaben apuntando al techo.',
          '1 s de pausa y vuelta controlada.'],
    cues: ['Peso ligero: se trabaja el manguito rotador y la parte posterior del hombro.'],
    video: 'face pull rope technique' },
  pallof: { name: 'Pallof press', type: 'str',
    how: ['De lado a la polea, que debe quedar a la altura del pecho, con el agarre pegado al esternón.',
          'Estira los brazos al frente sin dejar que la polea te gire el cuerpo. Aguanta 2 s y vuelve.'],
    cues: ['Glúteos y abdomen apretados.', 'Es un antirrotacional: el tronco no se mueve.'],
    video: 'pallof press cable' },
  hip_thrust: { name: 'Hip thrust con barra', type: 'str',
    how: ['Apoya la parte de abajo de las escápulas en el banco y la barra sobre la cadera, con un pad o una toalla debajo.',
          'Pies a la anchura de la cadera. Al subir, las rodillas quedan a 90°.',
          'Sube hasta que el cuerpo quede recto, aprieta el glúteo 2 s y baja controlando.'],
    cues: ['Barbilla metida y mirada al frente: la cabeza acompaña al tronco.', 'Que no tire la zona lumbar.'],
    alt: 'Si molesta, haz puente de glúteo en el suelo o hip thrust a una pierna sin peso.',
    video: 'barbell hip thrust technique' },
  stepup: { name: 'Step-up a cajón', type: 'str',
    how: ['Cajón de 50 cm, o el que te deje la rodilla a unos 90°, con una mancuerna en cada mano.',
          'Pisa con todo el pie y sube empujando con esa pierna, sin impulsarte con la de abajo.',
          'Baja lento con la misma pierna.'],
    cues: ['Tronco un poco inclinado hacia delante.', 'Si duele al subir la pierna al cajón, usa un cajón más bajo.'],
    video: 'dumbbell step up technique' },
  leg_curl: { name: 'Curl femoral (banco)', type: 'str',
    how: ['Boca abajo en el accesorio del banco, con el rodillo justo encima del talón.',

<script>
// ====== ESTADO Y ALMACENAMIENTO ======
const LS_KEY = 'gym-camacho-v1';
let S = { phase: 1, prOverrides: {}, crit: {}, draft: null, sel: null };
let LOGS = [];
let F = { days:{}, custom:{} };
let foodSub='reg', foodDate=null, editIdx=-1;
let backend = 'pending';   // 'db' | 'local'
let DB = null, UID = null;
let tab = 'hoy';

function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}}
function lsSet(v){try{localStorage.setItem(LS_KEY, JSON.stringify(v));}catch(e){}}
function setStatus(t){document.getElementById('status').textContent=t;}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}

// Guardado del estado (una escritura cada vez, con espera)
let saveTimer=null, saving=false, saveAgain=false, lastStateJson='', lastFoodJson='';
function logsCol(){ return DB.doc('data/users/'+UID+'/logs').collection('items'); }
function saveState(){ clearTimeout(saveTimer); saveTimer=setTimeout(flushState,700); }
let fTimer=null, fSaving=false, fAgain=false;
function saveFood(){ lsSet({S, LOGS, F}); clearTimeout(fTimer); fTimer=setTimeout(flushFood,700); }
async function flushFood(){
  fTimer=null;
  if(backend!=='db') return;
  if(fSaving){ fAgain=true; return; }
  fSaving=true;
  try{ const j=JSON.stringify(F); await DB.doc('data/users/'+UID+'/food').set(JSON.parse(j)); lastFoodJson=j; setStatus('☁️ guardado'); }
  catch(e){ setStatus('⚠️ no se pudo guardar'); }
  fSaving=false; if(fAgain){ fAgain=false; flushFood(); }
}
async function flushState(){
  saveTimer=null;
  lsSet({S, LOGS, F});
  if(backend!=='db') return;
  if(saving){ saveAgain=true; return; }
  saving=true;
  try{ const j=JSON.stringify(S); await DB.doc('data/users/'+UID+'/state').set(JSON.parse(j)); lastStateJson=j; setStatus('☁️ guardado'); }
  catch(e){ setStatus('⚠️ no se pudo guardar'); }
  saving=false;
  if(saveAgain){ saveAgain=false; flushState(); }
}
async function addLog(log){
  if(backend!=='db'){ LOGS.push(log); lsSet({S, LOGS, F}); return; }
  LOGS=LOGS.filter(x=>x.id!==log.id).concat([log]); lsSet({S, LOGS, F});
  await logsCol().doc(log.id).set(log);
}
async function delLog(id){
  if(backend!=='db'){ LOGS=LOGS.filter(l=>l.id!==id); lsSet({S, LOGS, F}); render(); return; }
  LOGS=LOGS.filter(l=>l.id!==id); lsSet({S, LOGS, F}); render();
  await logsCol().doc(id).delete();
}

async function init(){
  // Primero lo local, por si no hay conexión
  const l = lsGet(); if(l){ S = Object.assign(S, l.S||{}); LOGS = l.LOGS||[]; if(l.F) F = Object.assign(F, l.F); }
  render();
  if(STANDALONE){

    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    if('serviceWorker' in navigator && location.protocol.startsWith('http')){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
    render(); return;
  }
  let db=null, user=null, uid=null;
  try{
    if(window.claude && claude.use){
      [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if(db && user) uid = await user.id();
    }
  }catch(e){ uid=null; }
  if(!db || !uid){ backend='local'; setStatus('💾 solo en este dispositivo'); render(); return; }
  DB = db; UID = uid;
  try{ logsCol(); }catch(e){ backend='local'; setStatus('⚠️ error de almacenamiento'); render(); return; }
  backend = 'db';
  setStatus('sincronizando…');
  const ready={state:false, food:false, logs:false};
  let allReady=false;
  const done=k=>{ ready[k]=true; if(!allReady && ready.state&&ready.food&&ready.logs){ allReady=true; clearTimeout(to); setStatus('☁️ sincronizado'); safeRender(); } };
  const to = setTimeout(()=>setStatus('⚠️ sin conexión: lo que hagas se guarda al reconectar'), 10000);
  const fail=()=>{ setStatus('⚠️ error de sincronización'); };
  // Estado (sesión en curso, fase, marcas)
  DB.doc('data/users/'+UID+'/state').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites || saving || saveTimer) { if(!snap.metadata.fromCache) done('state'); return; }
    if(snap.exists){
      const remote = JSON.stringify(snap.data());
      if(remote!==lastStateJson){
        S = Object.assign({ phase:1, prOverrides:{}, crit:{}, draft:null, sel:null }, JSON.parse(remote));
        lastStateJson = remote; lsSet({S, LOGS, F});
        safeRender();
      }
    } else if(!snap.metadata.fromCache && !ready.state && l && l.S){ flushState(); }
    if(!snap.metadata.fromCache) done('state');
  }, fail);
  // Comida
  DB.doc('data/users/'+UID+'/food').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites || fSaving || fTimer) { if(!snap.metadata.fromCache) done('food'); return; }
    if(snap.exists){
      const remote = JSON.stringify(snap.data());
      if(remote!==lastFoodJson){
        F = Object.assign({days:{},custom:{}}, JSON.parse(remote));
        lastFoodJson = remote; lsSet({S, LOGS, F});
        safeRender();
      }
    } else if(!snap.metadata.fromCache && !ready.food && l && l.F && Object.keys(l.F.days||{}).length){ flushFood(); }
    if(!snap.metadata.fromCache) done('food');
  }, fail);
  // Historial de sesiones
  logsCol().onSnapshot(qs=>{
    const remote = qs.docs.map(d=>d.data()).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));
    if(!qs.metadata.fromCache && !ready.logs && l && l.LOGS && l.LOGS.length){
      // sube sesiones que solo estaban en este dispositivo
      const have=new Set(remote.map(x=>x.id));
      l.LOGS.filter(x=>x && x.id && !have.has(x.id)).forEach(x=>{ remote.push(x); logsCol().doc(x.id).set(x).catch(()=>{}); });
    }
    const changed = JSON.stringify(remote)!==JSON.stringify(LOGS);
    LOGS = remote; lsSet({S, LOGS, F});
    if(changed) safeRender();
    if(!qs.metadata.fromCache) done('logs');
  }, fail);
}
// No redibujar mientras escribes: se aplaza hasta que sueltas el campo
let pendingRender=false;
function safeRender(){ if(isTyping()){ pendingRender=true; return; } pendingRender=false; render(); }
document.addEventListener('focusout', ()=>{ if(!pendingRender) return; setTimeout(()=>{ if(pendingRender && !isTyping()){ pendingRender=false; render(); } }, 300); });
function isTyping(){const a=document.activeElement;return !!a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');}

// ====== CÁLCULOS ======
function rm(ref){ const o=S.prOverrides&&S.prOverrides[ref]; return o ? +o : BASE_PRS[ref].rm; }
function r25(x){ return Math.round(x/2.5)*2.5; }
function loadTxt(load){
  if(!load) return '';
  if(load.pct) return r25(rm(load.ref)*load.pct)+' kg';
  if(load.kg) return load.kg+' kg';
  return load.txt||'';
}
function loadKg(load){ if(!load) return ''; if(load.pct) return r25(rm(load.ref)*load.pct); if(load.kg) return load.kg; return ''; }
function e1rm(kg,reps){ kg=+kg; reps=parseInt(reps); if(!kg||!reps) return 0; return reps===1?kg:kg*(1+reps/30); }
function fmt(n){ return (Math.round(n*10)/10).toString().replace('.',','); }
function weekNo(){ const d0=new Date(START_DATE+'T00:00:00'); const d=new Date(); return Math.max(1, Math.floor((d-d0)/(7*864e5))+1); }
function isDeload(){ return weekNo()%5===0; }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fdate(s){ const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }

function itemsFor(sess){
  return sess.blocks.map(b=>({...b, items:b.items.filter(it=>it.ph.includes(S.phase))})).filter(b=>b.items.length);
}
function itemKey(sess,bi,ii){ return sess.id+'.'+bi+'.'+ii; }
function nextSession(){
  const sorted=[...LOGS].sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(!sorted.length) return 'D1';
  const last=sorted[sorted.length-1].session;
  const i=SESSIONS.findIndex(s=>s.id===last);
  return SESSIONS[(i+1)%SESSIONS.length].id;
}
function lastFor(exId){
  const sorted=[...LOGS].sort((a,b)=>(b.ts||0)-(a.ts||0));
  for(const l of sorted){ const e=(l.entries||[]).find(e=>e.ex===exId && e.sets && e.sets.some(s=>s.kg||s.reps)); if(e) return {date:l.date, sets:e.sets}; }
  return null;
}

// ====== BORRADOR DE SESIÓN ======
function ensureDraft(sid){
  if(S.draft && S.draft.session===sid) return S.draft;
  const sess=SESSIONS.find(s=>s.id===sid);
  const d={ session:sid, date:today(), phase:S.phase, items:{}, pain:0, rpe:7, notes:'' };
  sess.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{
    if(!it.ph.includes(S.phase)) return;
    const ex=EX[it.ex], k=ex.type+':'+it.ex+':'+bi+':'+ii;
    if(it.sets){
      const sg=suggest(it); const kg=sg.kg;
      d.items[k]={ ex:it.ex, sug:sg.kg, hint:sg.hint, sets:Array.from({length: isDeload()? Math.max(2,it.sets-1): it.sets},()=>({kg:kg, reps:'', done:false})) };
    } else d.items[k]={ ex:it.ex, done:false, min: it.cardio||'' };
  }));
  S.draft=d; return d;
}
// ====== PROGRESIÓN AUTOMÁTICA ======
const LOWER=new Set(['hip_thrust','hex_dl','back_squat','front_squat']);
const DBX=new Set(['cs_row','db_row','stepup','bss','lat_raise','goblet','farmer','suitcase']);
function suggest(it){
  const base=loadKg(it.load);
  if(base==='' ) return {kg:'', hint:''};
  const target=parseInt(it.reps); const last=lastFor(it.ex);
  if(!last || !target) return {kg:base, hint:''};
  const sets=last.sets.filter(s=>+s.kg && parseInt(s.reps));
  if(!sets.length) return {kg:base, hint:''};
  const lastKg=Math.max(...sets.map(s=>+s.kg));
  const top=sets.filter(s=>+s.kg===lastKg);
  const allHit = sets.length>=Math.max(2,it.sets-1) && top.every(s=>parseInt(s.reps)>=target);
  const isDb=DBX.has(it.ex), inc=isDb?2:(LOWER.has(it.ex)?5:2.5), cap=isDb?20:Infinity;
  if(isDeload()) { const k=isDb?lastKg:r25(lastKg*0.9); return {kg:k, hint:'Semana de descarga: '+fmt(k)+' kg, sin apretar.'}; }
  if(allHit){
    if(lastKg+inc>cap) return {kg:lastKg, hint:'Completaste todo, pero no hay mancuernas más pesadas: haz 1–2 repeticiones más por serie.'};
    let k=lastKg+inc; if(it.load&&it.load.pct&&base>k) k=base;
    return {kg:k, hint:'↑ +'+fmt(k-lastKg)+' kg: la última vez completaste todas las series.'};
  }
  return {kg:lastKg, hint:'= Repite '+fmt(lastKg)+' kg: la última vez no salieron todas las repeticiones.'};
}
function draftKey(it,bi,ii){ return EX[it.ex].type+':'+it.ex+':'+bi+':'+ii; }

  sorted.forEach(l=>{
    const vol=(l.entries||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,s)=>b+(+s.kg||0)*(parseInt(s.reps)||0),0),0);
    const col=l.pain>=5?'var(--bad)':l.pain>=3?'var(--warn)':'var(--acc)';
    const sess=SESSIONS.find(s=>s.id===l.session);
    h+=`<div class="card log" data-log="${esc(l.id)}"><div class="sum"><b>${fdate(l.date)}</b><span>${esc(l.session)}${sess?' · '+esc(sess.title):''}</span><span class="spacer"></span>
      <span class="chip"><span class="dot" style="background:${col}"></span>dolor ${l.pain??'–'}</span><span class="chip">RPE ${l.rpe??'–'}</span>${vol?`<span class="chip">${Math.round(vol)} kg vol.</span>`:''}</div>
      <div class="body">${(l.entries||[]).filter(e=>e.sets&&e.sets.some(s=>s.kg||s.reps)).map(e=>`<div class="small"><b>${esc(EX[e.ex]?EX[e.ex].name:e.ex)}</b>: ${e.sets.filter(s=>s.kg||s.reps).map(s=>(s.kg?fmt(+s.kg)+'×':'')+(s.reps||'–')).join(' · ')}</div>`).join('')}
      ${(l.cardio||[]).map(c=>`<div class="small">🚴 ${esc(EX[c.ex]?EX[c.ex].name:c.ex)}: ${esc(c.min)} min</div>`).join('')}
      ${l.notes?`<div class="small muted" style="margin-top:6px">📝 ${esc(l.notes)}</div>`:''}
      <button class="btn sm danger" style="margin-top:8px" data-dellog="${esc(l.id)}">Borrar</button></div></div>`;
  });
  const exIds=[...new Set(LOGS.flatMap(l=>(l.entries||[]).filter(e=>e.sets&&e.sets.some(s=>+s.kg&&parseInt(s.reps))).map(e=>e.ex)))];
  h+=`<h2>Progreso por ejercicio</h2>`;
  if(!exIds.length){ h+=`<div class="empty">Cuando registres series con kg y reps verás aquí tu evolución (1RM estimado).</div>`; return h; }
  const cur=S.histEx && exIds.includes(S.histEx)? S.histEx : exIds[0];
  h+=`<select class="sel" id="histEx">${exIds.map(id=>`<option value="${id}" ${id===cur?'selected':''}>${esc(EX[id]?EX[id].name:id)}</option>`).join('')}</select>`;
  const pts=[...LOGS].sort((a,b)=>(a.ts||0)-(b.ts||0)).map(l=>{
    const e=(l.entries||[]).find(e=>e.ex===cur); if(!e) return null;
    let best=null; e.sets.forEach(s=>{const v=e1rm(s.kg,s.reps); if(v&&(!best||v>best.v)) best={v,kg:+s.kg,reps:parseInt(s.reps)};});
    return best?{date:l.date,...best}:null;
  }).filter(Boolean);
  h+=`<div class="card">${chart(pts)}<table><tr><th>Fecha</th><th>Mejor serie</th><th class="n">1RM est.</th></tr>
    ${pts.slice().reverse().map(p=>`<tr><td>${fdate(p.date)}</td><td>${fmt(p.kg)} kg × ${p.reps}</td><td class="n">${fmt(p.v)}</td></tr>`).join('')}</table></div>`;
  return h;
}
function chart(pts){
  if(pts.length<2) return '<div class="small muted">Con 2 o más sesiones verás la gráfica.</div>';
  const W=600,H=160,P=28; const vs=pts.map(p=>p.v); let mn=Math.min(...vs), mx=Math.max(...vs); if(mx-mn<5){mx+=2.5;mn-=2.5;}
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del 1RM estimado">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="#2b322d"/>
    <text x="${P}" y="${y(mx)-6}">${fmt(mx)}</text><text x="${P}" y="${H-P+14}">${fmt(mn)}</text>
    <path d="${d}" fill="none" stroke="#9be15d" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#9be15d"><title>${fdate(p.date)} · ${fmt(p.v)} kg</title></circle>`).join('')}</svg>`;
}

function vPrs(){
  // mejor 1RM estimado registrado para ejercicios con referencia
  const best={};
  LOGS.forEach(l=>(l.entries||[]).forEach(e=>{const ref=EX[e.ex]&&EX[e.ex].pr; if(!ref||e.ex==='incline_bench'||e.ex==='hpc') return; (e.sets||[]).forEach(s=>{const v=e1rm(s.kg,s.reps); if(v>(best[ref]||0)) best[ref]=v;});}));
  let h=`<h2>Marcas que calculan las cargas</h2><div class="card"><table><tr><th>Ejercicio</th><th class="n">1RM usado</th><th></th></tr>
    ${Object.entries(BASE_PRS).map(([k,p])=>`<tr><td>${esc(p.name)}<div class="small muted">${esc(S.prOverrides[k]?'editado por ti':p.src)}</div>${best[k]&&best[k]>rm(k)?`<div class="small" style="color:var(--acc)">Nuevo estimado en tus registros: ${fmt(best[k])} kg <button class="btn sm" data-useprbest="${k}|${r25(best[k])}">usar</button></div>`:''}</td>
      <td class="n"><input data-pr="${k}" value="${rm(k)}" inputmode="decimal" style="width:76px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:right"></td>
      <td>${S.prOverrides[k]?`<button class="btn sm ghost" data-prreset="${k}">↺</button>`:''}</td></tr>`).join('')}</table>
    <div class="small muted" style="margin-top:8px">Si cambias una cifra, todas las cargas en % se recalculan. El 1RM estimado usa la fórmula de Epley: kg × (1 + reps/30).</div></div>
  <h2>Tus marcas de AimHarder</h2><div class="card"><table><tr><th>Ejercicio</th><th class="n">Marca</th><th class="n">Reps</th><th>Fecha</th></tr>
  ${AIM.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td><td class="n">${esc(r[2])}</td><td class="small">${esc(r[3])}</td></tr>`).join('')}</table></div>`;
  h+=vData();
  return h;
}

const BK_KEY='gym-camacho-lastbackup';
function lastBackup(){ try{ return +localStorage.getItem(BK_KEY)||0; }catch(e){ return 0; } }
function backupDue(){ const hasData=LOGS.length||Object.keys(F.days||{}).length; return hasData && Date.now()-lastBackup()>7*864e5; }
function exportJson(){ return JSON.stringify({app:'gym-camacho', v:1, exported:new Date().toISOString(), S, LOGS, F}); }
function vData(){
  const lb=lastBackup();
  return `<h2>Copia de seguridad</h2><div class="card small">
    <p>${STANDALONE?'Tus datos viven solo en este iPhone. Haz una copia de vez en cuando (la app te avisa cada 7 días) y guárdala en Archivos o iCloud Drive.':'Saca una copia de tus datos para pasarlos a la versión independiente de la app.'}</p>
    <p class="muted">Última copia: ${lb? new Date(lb).toLocaleDateString('es-ES')+' '+new Date(lb).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : 'nunca'} · ${LOGS.length} sesiones · ${Object.keys(F.days||{}).length} días de comida</p>
    <div class="row">${STANDALONE?'<button class="btn pri" id="bkExport">⬇️ Exportar copia</button>':''}<button class="btn ${STANDALONE?'':'pri'}" id="bkCopy">📋 Copiar datos</button>${STANDALONE?'<button class="btn" id="bkImport">⬆️ Importar copia</button>':''}</div>
    ${STANDALONE?'<input type="file" id="bkFile" accept=".json,application/json,text/plain" style="display:none">':''}
    <div id="bkArea" style="display:none;margin-top:10px"><textarea id="bkText" style="min-height:120px;font-size:11px"></textarea>
      <div class="row" style="margin-top:6px">${STANDALONE?'<button class="btn sm pri" id="bkPaste">Importar lo pegado</button>':''}<span class="muted">${STANDALONE?'Pega aquí los datos copiados desde la otra versión.':'Selecciona todo el texto y cópialo.'}</span></div></div>
  </div>`;
}
function importData(txt){
  let d; try{ d=JSON.parse(txt); }catch(e){ alert('Ese archivo o texto no es una copia válida.'); return; }
  if(!d || d.app!=='gym-camacho'){ alert('Ese archivo no es una copia de esta app.'); return; }
  if(!confirm('Esto reemplaza los datos de este móvil por los de la copia ('+(d.LOGS||[]).length+' sesiones). ¿Seguir?')) return;
  S=Object.assign({ phase:1, prOverrides:{}, crit:{}, draft:null, sel:null }, d.S||{}); LOGS=d.LOGS||[]; F=Object.assign({days:{},custom:{}}, d.F||{});
  lsSet({S, LOGS, F}); try{ localStorage.setItem(BK_KEY, String(Date.now())); }catch(e){}
  render(); toast('Datos importados');
}
function bindData(v){
  const ex=document.getElementById('bkExport'); if(!document.getElementById('bkCopy')) return;
  if(ex) ex.onclick=async()=>{
    const json=exportJson(); const name='gym-camacho-'+today()+'.json';
    let ok=false;
    try{
      const file=new File([json], name, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Copia gimnasio'}); ok=true; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    if(!ok){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); ok=true; }catch(e){} }
    if(ok){ try{ localStorage.setItem(BK_KEY, String(Date.now())); }catch(e){} toast('Copia exportada'); render(); }
    else showArea(json);
  };
  document.getElementById('bkCopy').onclick=async()=>{
    const json=exportJson();
    try{ await navigator.clipboard.writeText(json); toast('Datos copiados'); try{ localStorage.setItem(BK_KEY, String(Date.now())); }catch(e){} }
    catch(e){ showArea(json); }
  };
  const im=document.getElementById('bkImport'); if(im){
    const fi=document.getElementById('bkFile');
    im.onclick=()=>{ showArea(''); fi.click(); };
    fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importData(r.result); r.readAsText(f); };
    document.getElementById('bkPaste').onclick=()=>importData(document.getElementById('bkText').value);
  }
}
function showArea(txt){ const a=document.getElementById('bkArea'); a.style.display='block'; const t=document.getElementById('bkText'); t.value=txt; if(txt){ t.focus(); t.select(); } }

async function pickModel(key){
  const saved=lsg(GMODEL); if(saved) return saved;
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});
    if(r.ok){
      const j=await r.json();
      const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''))
        .filter(n=>/^gemini-[\d.]+-flash$/.test(n));
      const ver=n=>parseFloat(n.split('-')[1])||0;
      names.sort((a,b)=>ver(b)-ver(a));
      if(names[0]){ lss(GMODEL,names[0]); return names[0]; }
    }
  }catch(e){}
  return 'gemini-flash-latest';
}
const GMODELS='gym-gemini-models';
async function modelList(key){
  try{ const l=JSON.parse(lsg(GMODELS)||'null'); if(l&&l.length&&Date.now()-(+lsg(GMODELS+'-t')||0)<864e5) return l; }catch(e){}
  let names=[];
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});
    if(r.ok){ const j=await r.json();
      names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''))
        .filter(n=>/^gemini-[\d.]+-flash(-lite)?$/.test(n));
      const ver=n=>parseFloat(n.split('-')[1])||0, lite=n=>/lite$/.test(n)?1:0;
      names.sort((a,b)=>lite(a)-lite(b)||ver(b)-ver(a)); }
  }catch(e){}
  ['gemini-flash-latest','gemini-flash-lite-latest'].forEach(n=>{ if(!names.includes(n)) names.push(n); });
  lss(GMODELS, JSON.stringify(names)); lss(GMODELS+'-t', String(Date.now()));
  return names;
}

      let r, j={};
      try{ r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)}); j=await r.json().catch(()=>({})); }
      catch(e){ throw new Error('No hay conexión con Gemini. ¿Tienes internet?'); }
      if(r.ok){ lss(GMODEL, model); return j; }
      const msg=(j.error&&j.error.message)||'';
      if(r.status===400 && /API key/i.test(msg)) throw new Error('La clave no es válida. Revísala con el botón 🔑 en Coach.');
      if(r.status===403) throw new Error('La clave no tiene permiso para Gemini. Revísala en aistudio.google.com.');
      if(r.status===404){ lss(GMODELS,null); break; }               // modelo retirado: siguiente
      if(r.status===429){ lastErr='Límite gratuito de Gemini alcanzado por ahora. Prueba en un rato.'; break; } // cupo de ese modelo: siguiente
      if(r.status>=500){ lastErr='Gemini está saturado ahora mismo. Prueba en un minuto.'; onStatus&&onStatus('Gemini va lento, reintentando…'); await new Promise(res=>setTimeout(res, 1000)); continue; }
      throw new Error(msg||('Error '+r.status));
    }
  }
  throw new Error(lastErr||'No se pudo conectar con Gemini.');
}
async function askCoach(q){
  const key=lsg(GK); if(!key||chatBusy||!q.trim()) return;

      contents: chat.slice(-12).map(m=>({role:m.role==='user'?'user':'model', parts:[{text:m.text}]})) };
    if(lsg(GSEARCH)!=='0') body.tools=[{google_search:{}}];
    const j=await callGemini(body);

    const suggest=gm.searchEntryPoint&&gm.searchEntryPoint.renderedContent||'';

}

// ====== DICTADO GRABANDO + TRANSCRIPCIÓN CON GEMINI ======
// En iPhone el reconocimiento de voz de Safari falla a partir de la segunda vez (fallo conocido de WebKit)
// y no existe en las apps de la pantalla de inicio. Grabar con el micro (getUserMedia) sí funciona siempre,
// así que se graba el audio y Gemini lo pasa a texto.
let gRec=null;
function geminiDictateAvailable(){ return !!(lsg(GK) && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function geminiDictateActive(){ return !!gRec; }
function geminiDictateStop(){ if(gRec && gRec.state==='recording'){ try{ gRec.stop(); }catch(e){} } }
async function geminiDictate(onText, setState){
  if(gRec){ geminiDictateStop(); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ toast('Sin permiso para el micrófono. Revísalo en los ajustes del navegador.'); setState('idle'); return; }
  const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/aac'];
  const mime=types.find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } })||'';
  let rec; try{ rec=mime? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(t=>t.stop()); toast('Este navegador no permite grabar.'); setState('idle'); return; }
  const chunks=[]; gRec=rec;
  const hard=setTimeout(geminiDictateStop, 90000);
  rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop=async()=>{
    clearTimeout(hard); stream.getTracks().forEach(t=>t.stop()); gRec=null;
    const blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/mp4'});
    if(blob.size<1500){ setState('idle'); toast('No se ha grabado nada.'); return; }
    setState('busy');
    try{ const t=await transcribe(blob); if(t) onText(t); else toast('No te he entendido, prueba otra vez.'); }
    catch(e){ toast(e.message||'No se pudo transcribir.'); }
    setState('idle');
  };
  rec.start(); setState('rec');
}
async function toWav16k(blob){
  const buf=await blob.arrayBuffer();
  const tmp=new OfflineAudioContext(1, 16000, 16000);
  const decoded=await tmp.decodeAudioData(buf.slice(0));
  const len=Math.ceil(decoded.duration*16000);
  const off=new OfflineAudioContext(1, Math.max(1,len), 16000);
  const src=off.createBufferSource(); src.buffer=decoded; src.connect(off.destination); src.start();
  const out=(await off.startRendering()).getChannelData(0);
  const ab=new ArrayBuffer(44+out.length*2), v=new DataView(ab);
  const ws=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4,36+out.length*2,true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,out.length*2,true);
  for(let i=0;i<out.length;i++){ const x=Math.max(-1,Math.min(1,out[i])); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7fff, true); }
  return new Blob([ab],{type:'audio/wav'});
}
function b64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
async function transcribe(blob){
  let wav; try{ wav=await toWav16k(blob); }catch(e){ wav=blob; }
  const body={ contents:[{ role:'user', parts:[
    { inline_data:{ mime_type: wav.type||'audio/wav', data: await b64(wav) } },
    { text:'Transcribe literalmente este audio en español de España. Devuelve SOLO el texto transcrito, con puntuación, sin comillas ni comentarios. Si no hay voz, devuelve una cadena vacía.' } ] }],
    generationConfig:{ temperature:0 } };
  const j=await callGemini(body, m=>toast(m));
  const c=(j.candidates||[])[0]||{};
  return ((c.content&&c.content.parts)||[]).map(p=>p.text||'').join('').trim().replace(/^["“]|["”]$/g,'');
}

function draftHasData(){ return S.draft && Object.values(S.draft.items).some(x=>x.sets?x.sets.some(s=>s.done||s.reps):x.done); }

// ====== DICTADO ======
// Reconocimiento de voz del navegador.
// En iPhone, crear un reconocedor nuevo cada vez hace que a la segunda el micro se encienda sin captar
// nada. Por eso se usa UN SOLO reconocedor para toda la sesión, se va mostrando el texto mientras hablas,
// y si en 8 s no llega nada se reinicia solo para que la siguiente pulsación funcione.
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let SRI=null, recOn=false, recCtx=null, recIdle=null, recHard=null;
function getRec(){
  if(SRI) return SRI;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let r; try{ r=new SR(); }catch(e){ return null; }
  r.lang='es-ES'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  r.onresult=e=>{
    if(!recCtx) return;
    let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
    t=t.trim(); if(!t) return;
    recCtx.got=true; clearTimeout(recIdle);
    recCtx.set(recCtx.base ? recCtx.base.replace(/\s*$/,' ')+t : t.charAt(0).toUpperCase()+t.slice(1));
  };
  r.onerror=e=>{ const err=e&&e.error; if(recCtx && (err==='not-allowed'||err==='service-not-allowed'||err==='audio-capture')){ const f=recCtx.fail; endRec(); f(); } };
  r.onend=()=>endRec();
  SRI=r; return r;
}
function endRec(){
  clearTimeout(recIdle); clearTimeout(recHard);
  const c=recCtx; recCtx=null; recOn=false;
  if(c){ c.btn(false); c.done&&c.done(); if(!c.got) toast('No te he oído. Pulsa otra vez el micro.'); }
}
function stopRec(){
  if(!SRI || !recOn){ endRec(); return; }
  try{ SRI.stop(); }catch(e){}
  // si el iPhone no avisa de que ha terminado, se fuerza (solo para esta misma sesión)
  const ctx=recCtx;
  setTimeout(()=>{ if(recOn && recCtx===ctx){ try{ SRI.abort(); }catch(e){} endRec(); } }, 1500);
}
function browserDictate(getText, setText, setBtn, onFail, onDone){
  const r=getRec(); if(!r) return false;
  if(recOn){ stopRec(); return true; }
  recCtx={ base:getText(), set:setText, btn:setBtn, fail:onFail, done:onDone, got:false };
  const go=()=>{
    try{ r.start(); recOn=true; setBtn(true);
      recIdle=setTimeout(()=>{ if(recOn && recCtx && !recCtx.got){ try{ r.abort(); }catch(e){} SRI=null; endRec(); } }, 8000);
      recHard=setTimeout(stopRec, 120000);
    }catch(e){
      // se había quedado una sesión abierta: se cierra y se reintenta una vez con un reconocedor limpio
      try{ r.abort(); }catch(_){} SRI=null;
      const r2=getRec(); if(!r2){ endRec(); onFail(); return; }
      setTimeout(()=>{ try{ r2.start(); recOn=true; setBtn(true); recHard=setTimeout(stopRec,120000); }catch(_){ const f=onFail; recCtx=null; setBtn(false); f(); } }, 300);
    }
  };
  go();
  return true;
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && recOn) stopRec(); });

let dict=null, rec=null, listening=false;
try{ if(window.claude&&claude.use) claude.use('dictation').then(d=>{dict=d;}).catch(()=>{}); }catch(e){}
function setupMic(ta){
  const b=document.getElementById('mic'); if(!b) return;
  const append=t=>{ if(!t) return; ta.value=(ta.value?ta.value.replace(/\s*$/,' '):'')+t.trim(); S.draft.notes=ta.value; saveState(); };
  const setBtn=on=>{ listening=on; b.textContent=on?'⏹ Parar':'🎤 Dictar'; b.classList.toggle('pri',on); };
  b.onclick=()=>{
    if(typeof geminiDictate==='function' && (geminiDictateActive() || geminiDictateAvailable())){
      geminiDictate(append, st=>{ listening=false; b.disabled=(st==='busy'); b.classList.toggle('pri',st==='rec');
        b.textContent= st==='rec'?'⏹ Terminar':st==='busy'?'⏳ Transcribiendo…':'🎤 Dictar'; });
      return;
    }
    if(listening){ if(dict&&dict.active()) dict.stop(); stopRec(); return; }
    if(dict){ // escritorio (Chrome / app de Claude)
      dict.onFinal(({text})=>append(text)); dict.onState(({state})=>setBtn(state!=='idle'));
      dict.start({language:'es'}).catch(()=>{ kbTip(ta); }); return;
    }
    if(browserDictate(()=>ta.value, v=>{ ta.value=v; S.draft.notes=v; }, setBtn, ()=>kbTip(ta), ()=>saveState())) return;
    kbTip(ta);
  };
}
function kbTip(ta){ ta.focus(); try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(e){} toast('Este navegador no deja dictar aquí: usa el 🎤 del teclado'); }

// ====== TEMPORIZADOR ======
let tEnd=0, tInt=null;
function startTimer(sec){
  tEnd=Date.now()+sec*1000; const el=document.getElementById('timer'); el.classList.add('show'); el.classList.remove('end');
  clearInterval(tInt); tick(); tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.round((tEnd-Date.now())/1000); const el=document.getElementById('timer');
  document.getElementById('tLeft').textContent= left>0? fmtT(left) : '¡Ya!';
  if(left<=0 && !el.classList.contains('end')){ el.classList.add('end'); beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} setTimeout(()=>{ if(Date.now()>=tEnd){ el.classList.remove('show'); clearInterval(tInt);} },6000); }
}
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); [0,.25].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22);}); setTimeout(()=>{ try{ c.close(); }catch(e){} },800); }catch(e){} }
document.getElementById('tPlus').onclick=()=>{ tEnd=Math.max(tEnd,Date.now())+30000; document.getElementById('timer').classList.remove('end'); };
document.getElementById('tStop').onclick=()=>{ clearInterval(tInt); document.getElementById('timer').classList.remove('show'); };

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; render(); window.scrollTo(0,0); });
function flushNow(){ if(saveTimer){ clearTimeout(saveTimer); flushState(); } if(fTimer){ clearTimeout(fTimer); flushFood(); } }
window.addEventListener('beforeunload', flushNow);
